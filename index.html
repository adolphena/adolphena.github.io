<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light only">
<title>季晨阳 & 许慧敏 · 婚礼邀请</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(circle at 50% 45%, #fff8fb 0%, #ffe4ee 55%, #ffd0e0 100%);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
}

#pages {
  position: fixed; inset: 0; z-index: 2;
  transition: transform .75s cubic-bezier(.65,0,.35,1);
  will-change: transform;
}

.page {
  position: relative;
  width: 100%; height: 100vh; height: 100dvh;
  overflow: hidden;
}

/* ---------- 通用图片页 ---------- */
.page img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  display: block;
  user-select: none; -webkit-user-drag: none;
  opacity: 0; transition: opacity .7s ease;
}
.page img.loaded { opacity: 1; }
.cover-page img { object-position: center 40%; transition-duration: .9s; }

/* ---------- 封面文案 ---------- */
.cover-mask {
  position: absolute; left: 0; right: 0; bottom: 0; height: 58%;
  background: linear-gradient(to bottom,
    rgba(255,248,251,0) 0%, rgba(255,235,244,.55) 45%,
    rgba(255,224,238,.88) 75%, rgba(255,216,233,.97) 100%);
  pointer-events: none; z-index: 1;
}
.cover-content {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 7vw 9vh; text-align: center;
  pointer-events: none; user-select: none;
}
.cover-title {
  font-size: clamp(2rem, 8vw, 4.5rem); font-weight: 600;
  color: #9e2f58; line-height: 1.2;
  text-shadow: 0 2px 18px rgba(255,245,250,.95);
  margin-bottom: .35em;
}
.cover-tag {
  font-size: .8rem; font-weight: 500; letter-spacing: .3em;
  color: #b86a88; text-transform: uppercase; margin-bottom: .9em;
  text-shadow: 0 1px 10px rgba(255,245,250,.95);
}
.cover-names {
  font-size: clamp(1.1rem, 3.6vw, 1.6rem); font-weight: 500;
  letter-spacing: .18em; color: #7a3a52; margin-bottom: .5em;
  text-shadow: 0 1px 10px rgba(255,245,250,.95);
}
.cover-date {
  font-size: clamp(.9rem, 2.6vw, 1.1rem); letter-spacing: .22em;
  color: #8b5f70; text-shadow: 0 1px 8px rgba(255,245,250,.95);
}

/* ---------- 加载进度 / 开启按钮 ---------- */
.open-wrap {
  pointer-events: auto; margin-top: 1.5em;
  width: min(78vw, 320px);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  user-select: none;
}
.progress-bar {
  width: 100%; height: 6px; border-radius: 999px;
  background: rgba(180,90,130,.18); overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(150,60,100,.12);
}
.progress-fill {
  width: 0%; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #e78bb0, #b0416e);
  transition: width .25s ease;
}
.progress-text {
  font-size: .85rem; letter-spacing: .28em; color: #b86a88;
  text-shadow: 0 1px 6px rgba(255,245,250,.95);
}
.open-btn {
  display: none; align-items: center; gap: 10px;
  padding: 13px 34px; border-radius: 999px;
  border: 1px solid rgba(160,60,110,.6);
  background: rgba(255,248,252,.95); color: #8a2450;
  font-size: 1rem; font-weight: 500; letter-spacing: .18em;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 4px 16px rgba(200,120,150,.22);
  animation: openBtnPulse 2.6s ease-in-out infinite;
}
.open-btn.show { display: inline-flex; }
.open-btn:active { transform: scale(.97); }
.open-btn.hide {
  opacity: 0; transform: scale(.9);
  pointer-events: none; animation: none;
  transition: all .5s ease;
}
@keyframes openBtnPulse {
  0%,100% { box-shadow: 0 4px 16px rgba(200,120,150,.22); }
  50%     { box-shadow: 0 4px 24px rgba(210,110,155,.45); }
}

/* ---------- 照片页底部文案 ---------- */
.photo-overlay {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0 7vw 12vh; text-align: center;
  pointer-events: none; user-select: none;
  background: linear-gradient(to bottom,
    rgba(255,248,251,0) 0%, rgba(255,235,244,.55) 45%,
    rgba(255,224,238,.88) 70%, rgba(255,216,233,.97) 100%);
}
.photo-overlay .overlay-verse {
  font-size: clamp(.9rem, 3.4vw, 1.25rem); font-weight: 500;
  font-style: italic; letter-spacing: .14em; color: #7a3a52;
  line-height: 1.7;
  text-shadow: 0 1px 3px rgba(255,255,255,.95), 0 2px 12px rgba(255,245,250,.9);
  padding: 8px 20px; border-radius: 999px;
  background: rgba(255,248,252,.72);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}

/* ---------- 请柬页 ---------- */
#canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; z-index: 1;
}
.invite-content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: 100%; height: 100%; padding: 5vh 4vw;
  pointer-events: none; user-select: none;
}
.title {
  font-size: clamp(2rem, 10vw, 6rem); font-weight: 600;
  color: #9e2f58; line-height: 1.2; text-align: center;
  white-space: nowrap;
  text-shadow: 0 2px 16px rgba(255,200,220,.8);
}
.wedding-tag {
  font-size: .8rem; font-weight: 500; letter-spacing: .35em;
  color: #b86a88; margin-top: .9em; text-transform: uppercase;
  text-shadow: 0 1px 8px rgba(255,220,235,.9);
}
.names {
  font-size: 1.35rem; font-weight: 500; color: #7a3a52;
  letter-spacing: .12em; margin-top: 1em; white-space: nowrap;
  text-shadow: 0 1px 8px rgba(255,220,235,.9);
}
.subtitle {
  font-size: 1rem; color: #8b5f70; letter-spacing: .06em;
  margin-top: .6em; max-width: 90vw; text-align: center;
  text-shadow: 0 1px 6px rgba(255,225,238,.9);
}
.map-links {
  display: flex; gap: 10px; margin-top: 1.8em;
  flex-wrap: wrap; justify-content: center;
}
.map-link {
  pointer-events: auto;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 999px;
  background: rgba(255,248,252,.96);
  border: 1px solid rgba(180,80,130,.45);
  color: #8a2450; font-size: .9rem; font-weight: 500;
  letter-spacing: .06em; text-decoration: none;
  white-space: nowrap; user-select: none;
  box-shadow: 0 2px 10px rgba(200,120,150,.15);
  transition: transform .2s ease;
}
.map-link:active { transform: scale(.96); }
.map-link svg { flex-shrink: 0; opacity: .9; }

/* ---------- 右侧圆点 ---------- */
.dots {
  position: fixed; right: 10px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 10px; z-index: 10;
  opacity: 0; transition: opacity .6s ease;
}
.dots.show { opacity: 1; }
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: rgba(180,90,130,.28);
  border: none; padding: 0; cursor: pointer;
  transition: all .3s ease;
}
.dot.active { background: #b0416e; transform: scale(1.35); }

/* ---------- 上滑提示 ---------- */
.swipe-hint {
  position: fixed; bottom: 16px; left: 50%;
  transform: translateX(-50%);
  z-index: 10; color: #b86a88;
  font-size: .78rem; letter-spacing: .22em;
  opacity: 0; transition: opacity .5s ease;
  pointer-events: none;
  animation: bounce 2s infinite;
}
.swipe-hint.show { opacity: .85; }
@keyframes bounce {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50%     { transform: translateX(-50%) translateY(-6px); }
}

/* ---------- 音乐开关 ---------- */
.music-toggle {
  position: fixed; top: 14px; right: 14px; z-index: 20;
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid rgba(180,80,130,.35);
  background: rgba(255,248,252,.9); color: #9e2f58;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 2px 10px rgba(200,120,150,.18);
  -webkit-tap-highlight-color: transparent;
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease, transform .25s ease;
}
.music-toggle.show { opacity: 1; pointer-events: auto; }
.music-toggle:active { transform: scale(.94); }
.music-toggle .icon-music { display: none; }
.music-toggle .icon-muted { display: block; }
.music-toggle.playing .icon-music { display: block; }
.music-toggle.playing .icon-muted { display: none; }
.music-toggle.playing { animation: musicPulse 2.4s ease-in-out infinite; }
@keyframes musicPulse {
  0%,100% { box-shadow: 0 2px 10px rgba(200,120,150,.18); }
  50%     { box-shadow: 0 2px 18px rgba(210,110,155,.45); }
}
</style>
</head>
<body>

<audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

<button class="music-toggle" id="musicToggle" aria-label="音乐开关">
  <svg class="icon-music" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
  </svg>
  <svg class="icon-muted" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6zM3.27 2L2 3.27 20.73 22 22 20.73 3.27 2z"/>
  </svg>
</button>

<div id="pages">

  <!-- 封面 -->
  <section class="page cover-page">
    <img data-src="photo-1.jpg" alt="婚纱照封面" fetchpriority="high" decoding="async">
    <div class="cover-mask"></div>
    <div class="cover-content">
      <div class="cover-title">别来无恙啊</div>
      <div class="cover-tag">Wedding Invitation</div>
      <div class="cover-names">季晨阳 ♡ 许慧敏</div>
      <div class="cover-date">2026.11.14</div>

      <div class="open-wrap" id="openWrap">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">正在加载 0%</div>
        <button class="open-btn" id="openBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
          </svg>
          开启邀请函
        </button>
      </div>
    </div>
  </section>

  <!-- 照片页 2~5 -->
  <section class="page photo-page">
    <img data-src="photo-2.jpg" alt="婚纱照 2" decoding="async">
    <div class="photo-overlay"><div class="overlay-verse">朝暮与年岁并往，与你行至天光</div></div>
  </section>
  <section class="page photo-page">
    <img data-src="photo-3.jpg" alt="婚纱照 3" decoding="async">
    <div class="photo-overlay"><div class="overlay-verse">山水一程，三生有幸</div></div>
  </section>
  <section class="page photo-page">
    <img data-src="photo-4.jpg" alt="婚纱照 4" decoding="async">
    <div class="photo-overlay"><div class="overlay-verse">既见君子，云胡不喜</div></div>
  </section>
  <section class="page photo-page">
    <img data-src="photo-5.jpg" alt="婚纱照 5" decoding="async">
    <div class="photo-overlay"><div class="overlay-verse">愿有岁月可回首，且以深情共白头</div></div>
  </section>

  <!-- 请柬页 -->
  <section class="page invite-page">
    <canvas id="canvas"></canvas>
    <div class="invite-content">
      <div class="title" id="titleText">有幸相邀，盼君赴约</div>
      <div class="wedding-tag">Wedding Invitation</div>
      <div class="names">季晨阳 ♡ 许慧敏</div>
      <div class="subtitle">2026.11.14（周六）午宴</div>
      <div class="subtitle">富东大酒店（园区店）</div>
      <div class="map-links">
        <a class="map-link" href="https://surl.amap.com/88qmZiK1o5t8" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
          </svg>高德导航
        </a>
        <a class="map-link" href="https://j.map.baidu.com/a6/2cFM" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
          </svg>百度导航
        </a>
      </div>
    </div>
  </section>

</div>

<div class="dots" id="dots"></div>
<div class="swipe-hint" id="swipeHint">上滑查看 ↑</div>

<script>
(function () {
  // ========================================================
  //  一、初始化图片 src（仅手机端 photo-N.jpg）
  // ========================================================
  const imgs = document.querySelectorAll('.page img[data-src]');
  imgs.forEach(img => {
    const src = img.getAttribute('data-src');
    if (src) img.src = src;

    // 图片渐显
    const markLoaded = () => img.classList.add('loaded');
    if (img.complete && img.naturalWidth > 0) markLoaded();
    else {
      img.addEventListener('load', markLoaded, { once: true });
      img.addEventListener('error', markLoaded, { once: true });
    }
  });

  // ========================================================
  //  二、滑动翻页控制
  // ========================================================
  const pagesEl   = document.getElementById('pages');
  const pageEls   = Array.from(pagesEl.querySelectorAll('.page'));
  const dotsEl    = document.getElementById('dots');
  const swipeHint = document.getElementById('swipeHint');
  const total     = pageEls.length;

  let current = 0, animating = false, autoTimer = null, started = false;
  const AUTO_DELAY = 10000, ANIM_DURATION = 750;

  pageEls.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'dot' + (i === 0 ? ' active' : '');
    b.setAttribute('aria-label', '第 ' + (i + 1) + ' 页');
    b.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(b);
  });
  const dotEls = Array.from(dotsEl.children);

  function goTo(index) {
    if (animating) return;
    index = Math.max(0, Math.min(total - 1, index));
    if (index === current) { resetAuto(); return; }
    animating = true;
    current = index;
    pagesEl.style.transform = 'translateY(-' + (current * 100) + '%)';
    dotEls.forEach((d, i) => d.classList.toggle('active', i === current));
    updateHint();
    if (current === total - 1) {
      clearAuto();
      startParticlesOnce();
    } else {
      resetAuto();
    }
    setTimeout(() => { animating = false; }, ANIM_DURATION);
  }
  const next = () => goTo(current + 1);
  const prev = () => goTo(current - 1);

  function updateHint() {
    swipeHint.classList.toggle('show', started && current === 0 && total > 1);
  }
  function clearAuto() {
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  }
  function resetAuto() {
    clearAuto();
    if (!started || current >= total - 1) return;
    autoTimer = setTimeout(() => {
      if (!animating) next(); else resetAuto();
    }, AUTO_DELAY);
  }

  // 触摸滑页
  let touchStartY = 0, touching = false;
  window.addEventListener('touchstart', e => {
    if (!started || e.touches.length !== 1) return;
    touchStartY = e.touches[0].clientY;
    touching = true;
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (!touching) return;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(dy) > 50) {
      touching = false;
      dy < 0 ? next() : prev();
    }
  }, { passive: true });
  window.addEventListener('touchend', () => { touching = false; }, { passive: true });

  window.addEventListener('keydown', e => {
    if (!started) return;
    if (e.key === 'ArrowDown' || e.key === 'PageDown') next();
    if (e.key === 'ArrowUp'   || e.key === 'PageUp')  prev();
  });

  // ========================================================
  //  三、加载进度 + 开启邀请函
  // ========================================================
  const bgMusic      = document.getElementById('bgMusic');
  const musicToggle  = document.getElementById('musicToggle');
  const openBtn      = document.getElementById('openBtn');
  const progressBar  = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');

  const totalCount = imgs.length + 1;
  let doneCount = 0, progressDone = false;

  function tick() {
    if (progressDone) return;
    doneCount++;
    const percent = Math.min(100, Math.round(doneCount / totalCount * 100));
    progressFill.style.width = percent + '%';
    progressText.textContent = '正在加载 ' + percent + '%';
    if (doneCount >= totalCount) {
      progressDone = true;
      progressBar.style.display = 'none';
      progressText.style.display = 'none';
      openBtn.classList.add('show');
    }
  }

  // 图片
  imgs.forEach(img => {
    if (img.complete && img.naturalWidth > 0) tick();
    else {
      img.addEventListener('load', tick, { once: true });
      img.addEventListener('error', tick, { once: true });
    }
  });
  // 音频（复用 bgMusic，不再 new Audio 造成重复请求）
  if (bgMusic.readyState >= 2) tick();
  else {
    bgMusic.addEventListener('loadeddata', tick, { once: true });
    bgMusic.addEventListener('error', tick, { once: true });
    setTimeout(tick, 3000); // 兜底
  }

  let musicPlaying = false;

  function playMusic() {
    bgMusic.volume = 0.6;
    bgMusic.play().then(() => {
      musicPlaying = true;
      musicToggle.classList.add('playing');
    }).catch(() => {});
  }

  function doOpen() {
    if (started) return;
    started = true;
    playMusic();
    openBtn.classList.add('hide');
    dotsEl.classList.add('show');
    musicToggle.classList.add('show');
    setTimeout(() => { goTo(1); resetAuto(); }, 380);
  }
  openBtn.addEventListener('click', doOpen);

  musicToggle.addEventListener('click', e => {
    e.stopPropagation();
    if (musicPlaying) {
      bgMusic.pause();
      musicPlaying = false;
      musicToggle.classList.remove('playing');
    } else {
      bgMusic.volume = 0.6;
      bgMusic.play().then(() => {
        musicPlaying = true;
        musicToggle.classList.add('playing');
      }).catch(() => {});
    }
  });

  // ========================================================
  //  四、爱心粒子（仅最后一页）
  // ========================================================
  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');
  const titleEl = document.getElementById('titleText');
  let particles = [], particleStarted = false;
  let touchX = -9999, touchY = -9999, touchActive = false;

  function resizeCanvas() {
    canvas.width  = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    initParticles();
    adjustTitleFontSize();
  }

  function adjustTitleFontSize() {
    if (!titleEl) return;
    const maxWidth  = window.innerWidth * 0.9;
    const baseSize  = 16;
    titleEl.style.fontSize = baseSize + 'px';
    const w = titleEl.scrollWidth;
    if (!w) return;
    let size = baseSize * (maxWidth / w);
    size = Math.min(160, Math.max(32, size));
    size = Math.min(size, window.innerHeight * 0.25);
    titleEl.style.fontSize = size + 'px';
    titleEl.style.lineHeight = '1.2';
  }

  function initParticles() {
    particles = [];
    const count = Math.floor((canvas.width * canvas.height) / 3500);
    const n = Math.max(80, Math.min(count, 400));
    for (let i = 0; i < n; i++) {
      const vx = (Math.random() - 0.5) * 0.4;
      const vy = (Math.random() - 0.5) * 0.4;
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx, vy, baseVx: vx, baseVy: vy,
        size: Math.random() * 6 + 4,
        alpha: Math.random() * 0.3 + 0.12,
        rotation: Math.random() * Math.PI * 2
      });
    }
  }

  // 触摸交互（仅手机）
  window.addEventListener('touchmove', e => {
    if (e.touches.length > 0) {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      touchActive = true;
    }
  }, { passive: true });
  window.addEventListener('touchend', () => {
    touchActive = false; touchX = touchY = -9999;
  });

  function drawHeart(c, x, y, size, rotation, color) {
    c.save();
    c.translate(x, y);
    c.rotate(rotation);
    const s = size / 16;
    c.scale(s, s);
    c.beginPath();
    c.moveTo(0, 4);
    c.bezierCurveTo(0, 0, -8, 0, -8, 6);
    c.bezierCurveTo(-8, 11, -4, 14, 0, 18);
    c.bezierCurveTo(4, 14, 8, 11, 8, 6);
    c.bezierCurveTo(8, 0, 0, 0, 0, 4);
    c.closePath();
    c.fillStyle = color;
    c.fill();
    c.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const hasTouch = touchActive && touchX > -1000;

    particles.forEach(p => {
      if (hasTouch) {
        const dx = touchX - p.x, dy = touchY - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 180 && dist > 0) {
          const force = (1 - dist / 180) * 0.12;
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;
          p.rotation += 0.05;
        }
      }
      p.vx += (p.baseVx - p.vx) * 0.02;
      p.vy += (p.baseVy - p.vy) * 0.02;
      p.rotation += 0.005;
      p.x += p.vx; p.y += p.vy;

      if (p.x < -20) p.x = canvas.width + 20;
      if (p.x > canvas.width + 20) p.x = -20;
      if (p.y < -20) p.y = canvas.height + 20;
      if (p.y > canvas.height + 20) p.y = -20;

      let color;
      if (hasTouch) {
        const dist = Math.hypot(touchX - p.x, touchY - p.y);
        if (dist < 180) {
          const t = 1 - dist / 180;
          const r = Math.round(212 + 43 * t);
          const g = Math.round(106 + 37 * t);
          const b = Math.round(146 + 30 * t);
          color = `rgba(${r},${g},${b},${p.alpha + t * 0.35})`;
        } else {
          color = `rgba(224,130,170,${p.alpha * 0.95})`;
        }
      } else {
        color = `rgba(230,140,175,${p.alpha * 0.9})`;
      }
      drawHeart(ctx, p.x, p.y, p.size, p.rotation, color);
    });

    if (hasTouch) {
      particles.forEach(p => {
        const dist = Math.hypot(touchX - p.x, touchY - p.y);
        if (dist < 140) {
          ctx.beginPath();
          ctx.moveTo(touchX, touchY);
          ctx.lineTo(p.x, p.y);
          ctx.strokeStyle = `rgba(235,130,175,${(1 - dist / 140) * 0.28})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      });
    }
    requestAnimationFrame(animate);
  }

  function startParticlesOnce() {
    if (particleStarted) return;
    particleStarted = true;
    resizeCanvas();
    animate();
  }

  window.addEventListener('resize', () => {
    resizeCanvas();
    pagesEl.style.transform = 'translateY(-' + (current * 100) + '%)';
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(adjustTitleFontSize);
  }
  window.addEventListener('load', adjustTitleFontSize);
})();
</script>
</body>
</html>
