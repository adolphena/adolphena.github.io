<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light only">
  <title>季晨阳 & 许慧敏 · 婚礼邀请</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #fff8fb 0%, #ffe4ee 55%, #ffd0e0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #pages {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      transition: transform 0.75s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }

    .page {
      position: relative;
      width: 100%; height: 100vh; height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* =====================================================
       第 1 页：封面
       ===================================================== */
    .cover-page {
      position: relative;
      padding: 0;
      background: transparent;
      display: block;
    }

    .cover-page picture { display: block; width: 100%; height: 100%; }

    .cover-page img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 40%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    .cover-page img.loaded { opacity: 1; }

    .cover-mask {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 58%;
      background: linear-gradient(
        to bottom,
        rgba(255, 248, 251, 0) 0%,
        rgba(255, 235, 244, 0.55) 45%,
        rgba(255, 224, 238, 0.88) 75%,
        rgba(255, 216, 233, 0.97) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    .cover-content {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0 6vw 9vh;
      text-align: center;
      pointer-events: none;
      user-select: none;
    }

    .cover-title {
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #9e2f58;
      line-height: 1.2;
      text-shadow: 0 2px 18px rgba(255, 245, 250, 0.95);
      margin-bottom: 0.35em;
    }

    .cover-tag {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.4em;
      color: #b86a88;
      text-transform: uppercase;
      margin-bottom: 0.9em;
      text-shadow: 0 1px 10px rgba(255, 245, 250, 0.95);
    }

    .cover-names {
      font-size: clamp(1.1rem, 3.6vw, 1.6rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      color: #7a3a52;
      margin-bottom: 0.5em;
      text-shadow: 0 1px 10px rgba(255, 245, 250, 0.95);
    }

    .cover-date {
      font-size: clamp(0.9rem, 2.6vw, 1.1rem);
      font-weight: 400;
      letter-spacing: 0.22em;
      color: #8b5f70;
      text-shadow: 0 1px 8px rgba(255, 245, 250, 0.95);
    }

    /* ---------- 封面：进度 / 开启按钮 ---------- */
    .open-wrap {
      pointer-events: auto;
      margin-top: 1.8em;
      width: min(78vw, 320px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      user-select: none;
    }

    /* 进度条容器 */
    .progress-bar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(180, 90, 130, 0.18);
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(150, 60, 100, 0.12);
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #e78bb0, #b0416e);
      transition: width 0.25s ease;
    }

    /* 进度文字 / 开启按钮（同一位置切换） */
    .progress-text {
      font-size: 0.85rem;
      letter-spacing: 0.28em;
      color: #b86a88;
      text-shadow: 0 1px 6px rgba(255, 245, 250, 0.95);
    }

    .open-btn {
      display: none;                /* 默认隐藏，加载完显示 */
      align-items: center;
      gap: 10px;
      padding: 13px 34px;
      border-radius: 999px;
      border: 1px solid rgba(160, 60, 110, 0.6);
      background: rgba(255, 248, 252, 0.95);
      color: #8a2450;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 16px rgba(200, 120, 150, 0.22);
      transition: all 0.28s ease;
      animation: openBtnPulse 2.6s ease-in-out infinite;
    }
    .open-btn.show { display: inline-flex; }
    .open-btn:hover {
      background: #fff0f6;
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 22px rgba(210, 110, 155, 0.35);
    }
    .open-btn:active { transform: translateY(0) scale(0.98); }
    .open-btn svg { flex-shrink: 0; opacity: 0.9; }

    @keyframes openBtnPulse {
      0%, 100% { box-shadow: 0 4px 16px rgba(200, 120, 150, 0.22); }
      50% { box-shadow: 0 4px 24px rgba(210, 110, 155, 0.45); }
    }

    .open-btn.hide {
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: all 0.5s ease;
      animation: none;
    }

    /* =====================================================
       照片页（第 2~5 页）
       ===================================================== */
    .photo-page {
      padding: 0;
      background: transparent;
      position: relative;
    }
    .photo-page picture { display: block; width: 100%; height: 100%; }

    .photo-page img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    .photo-page img.loaded { opacity: 1; }

    .photo-page::after {
      content: "加载中…";
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      color: #c98aa6;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      opacity: 0;
      pointer-events: none;
    }
    .photo-page.loading::after { opacity: 0.7; }

    .photo-overlay {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 6vw 13vh;
      text-align: center;
      pointer-events: none;
      user-select: none;
      background: linear-gradient(
        to bottom,
        rgba(255, 248, 251, 0) 0%,
        rgba(255, 235, 244, 0.55) 45%,
        rgba(255, 224, 238, 0.88) 70%,
        rgba(255, 216, 233, 0.97) 100%
      );
    }

    .photo-overlay .overlay-verse {
      font-size: clamp(0.95rem, 3.4vw, 1.25rem);
      font-weight: 500;
      font-style: italic;
      letter-spacing: 0.14em;
      color: #7a3a52;
      line-height: 1.7;
      text-shadow:
        0 1px 3px rgba(255, 255, 255, 0.95),
        0 2px 12px rgba(255, 245, 250, 0.9);
      display: inline-block;
      padding: 8px 20px;
      border-radius: 999px;
      background: rgba(255, 248, 252, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* =====================================================
       最后一页：请柬
       ===================================================== */
    #canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; display: block; z-index: 1;
    }

    .invite-content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding: 5vh 4vw;
      pointer-events: none; user-select: none;
      white-space: nowrap; box-sizing: border-box;
    }

    .title {
      font-size: clamp(2rem, 10vw, 6rem);
      font-weight: 600; letter-spacing: -0.02em;
      color: #9e2f58; line-height: 1.2; text-align: center;
      white-space: nowrap; display: inline-block;
      padding: 0 0.1em;
      transition: font-size 0.1s ease;
      text-shadow: 0 2px 16px rgba(255, 200, 220, 0.8);
    }

    .wedding-tag {
      font-size: 0.95rem; font-weight: 500;
      letter-spacing: 0.35em; color: #b86a88;
      margin-top: 0.9em; text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(255, 220, 235, 0.9);
    }

    .names {
      font-size: 1.8rem; font-weight: 500;
      color: #7a3a52; letter-spacing: 0.12em;
      margin-top: 1.2em; white-space: nowrap;
      text-align: center; line-height: 1.4;
      transition: font-size 0.1s ease;
      text-shadow: 0 1px 8px rgba(255, 220, 235, 0.9);
    }

    .subtitle {
      font-size: 1.25rem; font-weight: 400;
      color: #8b5f70; letter-spacing: 0.06em;
      margin-top: 0.7em; white-space: nowrap;
      text-align: center; line-height: 1.5;
      transition: font-size 0.1s ease;
      text-shadow: 0 1px 6px rgba(255, 225, 238, 0.9);
    }

    .map-links {
      display: flex; gap: 14px;
      margin-top: 2.2em; flex-wrap: wrap; justify-content: center;
    }

    .map-link {
      pointer-events: auto;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 24px; border-radius: 999px;
      background: rgba(255, 248, 252, 0.96);
      border: 1px solid rgba(180, 80, 130, 0.45);
      color: #8a2450; font-size: 1rem; font-weight: 500;
      letter-spacing: 0.06em; text-decoration: none;
      transition: all 0.25s ease; white-space: nowrap;
      user-select: none;
      box-shadow: 0 2px 10px rgba(200, 120, 150, 0.15);
    }
    .map-link:hover {
      background: #fff0f6;
      border-color: rgba(160, 60, 110, 0.75);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(210, 110, 155, 0.28);
    }
    .map-link:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(210, 110, 155, 0.2);
    }
    .map-link svg { flex-shrink: 0; opacity: 0.9; }

    /* ---------- 右侧圆点 ---------- */
    .dots {
      position: fixed; right: 18px; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 10;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .dots.show { opacity: 1; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(180, 90, 130, 0.28);
      border: none; padding: 0; cursor: pointer;
      transition: all 0.3s ease;
    }
    .dot.active { background: #b0416e; transform: scale(1.35); }

    /* ---------- 上滑提示 ---------- */
    .swipe-hint {
      position: fixed; bottom: 22px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; color: #b86a88;
      font-size: 0.78rem; letter-spacing: 0.22em;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      opacity: 0; transition: opacity 0.5s ease;
      pointer-events: none;
      animation: bounce 2s infinite;
    }
    .swipe-hint.show { opacity: 0.85; }
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    /* ---------- 右上角音乐开关 ---------- */
    .music-toggle {
      position: fixed;
      top: 18px; right: 18px;
      z-index: 20;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(180, 80, 130, 0.35);
      background: rgba(255, 248, 252, 0.9);
      color: #9e2f58;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 2px 10px rgba(200, 120, 150, 0.18);
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, background 0.25s ease, transform 0.25s ease;
    }
    .music-toggle.show { opacity: 1; pointer-events: auto; }
    .music-toggle:hover { background: #fff0f6; transform: scale(1.06); }
    .music-toggle:active { transform: scale(0.96); }

    .music-toggle .icon-music { display: none; }
    .music-toggle .icon-muted { display: block; }
    .music-toggle.playing .icon-music { display: block; }
    .music-toggle.playing .icon-muted { display: none; }

    .music-toggle.playing { animation: musicPulse 2.4s ease-in-out infinite; }
    @keyframes musicPulse {
      0%, 100% { box-shadow: 0 2px 10px rgba(200, 120, 150, 0.18); }
      50% { box-shadow: 0 2px 18px rgba(210, 110, 155, 0.45); }
    }

    @media (max-width: 600px) {
      .cover-content { padding: 0 7vw 9vh; }
      .wedding-tag { font-size: 0.8rem; letter-spacing: 0.3em; }
      .names { font-size: 1.35rem; margin-top: 1em; }
      .subtitle {
        font-size: 1rem; margin-top: 0.6em;
        white-space: normal; max-width: 90vw;
      }
      .map-links { margin-top: 1.8em; gap: 10px; }
      .map-link { padding: 10px 18px; font-size: 0.9rem; }
      .title { text-shadow: 0 1px 10px rgba(255, 210, 225, 0.9); }
      .dots { right: 10px; }
      .swipe-hint { bottom: 16px; }
      .photo-overlay { padding: 0 7vw 12vh; }
      .photo-overlay .overlay-verse { font-size: 0.9rem; }
      .music-toggle { top: 14px; right: 14px; width: 36px; height: 36px; }
      .open-wrap { margin-top: 1.5em; }
    }
  </style>
</head>
<body>

  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  <button class="music-toggle" id="musicToggle" aria-label="音乐开关">
    <svg class="icon-music" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
    </svg>
    <svg class="icon-muted" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6zM3.27 2L2 3.27 20.73 22 22 20.73 3.27 2z"/>
    </svg>
  </button>

  <div id="pages">

    <!-- ===== 第 1 页：封面 ===== -->
    <section class="page cover-page" data-page="0">
      <picture>
        <source media="(max-width: 768px)" srcset="photo-1-mobile.jpg">
        <img src="photo-1.jpg" alt="婚纱照封面"
             fetchpriority="high" decoding="async">
      </picture>

      <div class="cover-mask"></div>

      <div class="cover-content">
        <div class="cover-title">别来无恙啊</div>
        <div class="cover-tag">Wedding Invitation</div>
        <div class="cover-names">季晨阳 ♡ 许慧敏</div>
        <div class="cover-date">2026.11.14</div>

        <!-- 进度条 / 开启按钮 -->
        <div class="open-wrap" id="openWrap">
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">正在加载 0%</div>

          <button class="open-btn" id="openBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
              <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
            </svg>
            开启邀请函
          </button>
        </div>
      </div>
    </section>

    <!-- ===== 第 2~5 页：婚纱照 ===== -->
    <section class="page photo-page" data-page="1">
      <picture>
        <source media="(max-width: 768px)" srcset="photo-2-mobile.jpg">
        <img src="photo-2.jpg" alt="婚纱照 2" decoding="async">
      </picture>
      <div class="photo-overlay">
        <div class="overlay-verse">朝暮与年岁并往，与你行至天光</div>
      </div>
    </section>

    <section class="page photo-page" data-page="2">
      <picture>
        <source media="(max-width: 768px)" srcset="photo-3-mobile.jpg">
        <img src="photo-3.jpg" alt="婚纱照 3" decoding="async">
      </picture>
      <div class="photo-overlay">
        <div class="overlay-verse">山水一程，三生有幸</div>
      </div>
    </section>

    <section class="page photo-page" data-page="3">
      <picture>
        <source media="(max-width: 768px)" srcset="photo-4-mobile.jpg">
        <img src="photo-4.jpg" alt="婚纱照 4" decoding="async">
      </picture>
      <div class="photo-overlay">
        <div class="overlay-verse">既见君子，云胡不喜</div>
      </div>
    </section>

    <section class="page photo-page" data-page="4">
      <picture>
        <source media="(max-width: 768px)" srcset="photo-5-mobile.jpg">
        <img src="photo-5.jpg" alt="婚纱照 5" decoding="async">
      </picture>
      <div class="photo-overlay">
        <div class="overlay-verse">愿有岁月可回首，且以深情共白头</div>
      </div>
    </section>

    <!-- ===== 第 6 页：请柬 ===== -->
    <section class="page invite-page" data-page="5">
      <canvas id="canvas"></canvas>
      <div class="invite-content">
        <div class="title" id="titleText">有幸相邀，盼君赴约</div>
        <div class="wedding-tag">Wedding Invitation</div>
        <div class="names">季晨阳 ♡ 许慧敏</div>
        <div class="subtitle">2026.11.14（周六）午宴</div>
        <div class="subtitle">富东大酒店（园区店）</div>

        <div class="map-links">
          <a class="map-link" href="https://surl.amap.com/88qmZiK1o5t8" target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
            高德导航
          </a>
          <a class="map-link" href="https://j.map.baidu.com/a6/2cFM" target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
            百度导航
          </a>
        </div>
      </div>
    </section>

  </div>

  <div class="dots" id="dots"></div>
  <div class="swipe-hint" id="swipeHint">上滑查看 ↑</div>

  <script>
    (function() {
      // ========================================================
      //  一、整页滑动控制
      // ========================================================
      const pagesEl = document.getElementById('pages');
      const pageEls = Array.from(pagesEl.querySelectorAll('.page'));
      const dotsEl = document.getElementById('dots');
      const swipeHint = document.getElementById('swipeHint');
      const total = pageEls.length;

      let current = 0;
      let animating = false;
      let autoTimer = null;
      let started = false;          // 是否已点击「开启邀请函」
      const AUTO_DELAY = 10000;     // 10 秒无操作自动翻页
      const ANIM_DURATION = 750;

      pageEls.forEach((_, i) => {
        const b = document.createElement('button');
        b.className = 'dot' + (i === 0 ? ' active' : '');
        b.setAttribute('aria-label', '第 ' + (i + 1) + ' 页');
        b.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(b);
      });
      const dotEls = Array.from(dotsEl.children);

      function goTo(index) {
        if (animating) return;
        index = Math.max(0, Math.min(total - 1, index));
        if (index === current) { resetAuto(); return; }
        animating = true;
        pageEls.forEach((p, i) => p.classList.toggle('active', i === index));
        current = index;
        pagesEl.style.transform = 'translateY(-' + (current * 100) + '%)';
        dotEls.forEach((d, i) => d.classList.toggle('active', i === current));
        updateHint();
        if (current === total - 1) clearAuto();
        else resetAuto();
        setTimeout(() => { animating = false; }, ANIM_DURATION);
      }

      function next() { goTo(current + 1); }
      function prev() { goTo(current - 1); }

      function updateHint() {
        if (started && current === 0 && total > 1) swipeHint.classList.add('show');
        else swipeHint.classList.remove('show');
      }

      function clearAuto() {
        if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
      }
      function resetAuto() {
        clearAuto();
        if (!started || current >= total - 1) return;
        autoTimer = setTimeout(() => {
          if (!animating) next();
          else resetAuto();
        }, AUTO_DELAY);
      }

      let wheelLock = false;
      window.addEventListener('wheel', (e) => {
        if (!started) return;
        if (Math.abs(e.deltaY) < 8) return;
        if (wheelLock) return;
        wheelLock = true;
        setTimeout(() => { wheelLock = false; }, ANIM_DURATION);
        if (e.deltaY > 0) next(); else prev();
      }, { passive: true });

      let touchStartY = 0;
      let touching = false;
      window.addEventListener('touchstart', (e) => {
        if (!started) return;
        if (e.touches.length !== 1) return;
        touchStartY = e.touches[0].clientY;
        touching = true;
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (!touching) return;
        const dy = e.touches[0].clientY - touchStartY;
        if (Math.abs(dy) > 50) {
          touching = false;
          if (dy < 0) next(); else prev();
        }
      }, { passive: true });
      window.addEventListener('touchend', () => { touching = false; }, { passive: true });

      window.addEventListener('keydown', (e) => {
        if (!started) return;
        if (e.key === 'ArrowDown' || e.key === 'PageDown') next();
        if (e.key === 'ArrowUp' || e.key === 'PageUp') prev();
      });

      pageEls.forEach((p, i) => p.classList.toggle('active', i === 0));

      // ========================================================
      //  二、预加载所有媒体（图片 + 音乐），显示进度
      // ========================================================
      const bgMusic = document.getElementById('bgMusic');
      const musicToggle = document.getElementById('musicToggle');
      const openBtn = document.getElementById('openBtn');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const progressBar = document.getElementById('progressBar');

      let musicPlaying = false;

      // 1. 收集所有需要预加载的资源
      //    图片：取每个 <picture> 里当前实际生效的 <img> 的 src
      //    移动端还会用 <source>，这里简单起见，以 <img> 的 src 为准；
      //    如果想连 mobile 版本也预加载，可把 source 的 srcset 也加进来。
      const imageSrcs = [];
      document.querySelectorAll('.page img').forEach(img => {
        if (img.src) imageSrcs.push(img.src);
      });

      // 音乐
      const musicSrc = bgMusic.getAttribute('src');

      const resources = [
        ...imageSrcs.map(src => ({ type: 'image', src })),
        { type: 'audio', src: musicSrc }
      ];

      const totalCount = resources.length;
      let loadedCount = 0;
      let failedCount = 0;

      function updateProgress() {
        const done = loadedCount + failedCount;
        const percent = totalCount === 0 ? 100 : Math.round((done / totalCount) * 100);
        progressFill.style.width = percent + '%';
        progressText.textContent = '正在加载 ' + percent + '%';

        if (done >= totalCount) {
          // 全部完成（成功或失败）→ 显示开启按钮
          progressBar.style.display = 'none';
          progressText.style.display = 'none';
          openBtn.classList.add('show');
        }
      }

      function preloadOne(item) {
        return new Promise((resolve) => {
          if (item.type === 'image') {
            const img = new Image();
            img.onload = () => { loadedCount++; updateProgress(); resolve(); };
            img.onerror = () => { failedCount++; updateProgress(); resolve(); };
            img.src = item.src;
          } else {
            // 音频：用一个独立 Audio 预加载，避免影响背景音乐元素本身
            const audio = new Audio();
            audio.preload = 'auto';
            const onDone = () => {
              loadedCount++; updateProgress(); resolve();
            };
            const onFail = () => {
              failedCount++; updateProgress(); resolve();
            };
            audio.addEventListener('canplaythrough', onDone, { once: true });
            audio.addEventListener('error', onFail, { once: true });
            audio.src = item.src;
            audio.load();

            // 兜底：如果 15 秒还没触发 canplaythrough（网络极慢），也算完成，避免卡死
            setTimeout(() => {
              if (!audio._done) {
                audio._done = true;
                // 已 resolve 过就不再重复，这里用标志位防重
              }
            }, 15000);
          }
        });
      }

      // 串行或并行都行，这里并行加载，速度快
      Promise.all(resources.map(preloadOne)).then(() => {
        // 保险：如果还有没更新到 100% 的情况，强制收尾
        loadedCount = totalCount;
        failedCount = 0;
        updateProgress();
      });

      // ========================================================
      //  三、开启邀请函：播放音乐 + 翻到第二页
      // ========================================================
      function playMusic() {
        if (!bgMusic) return;
        bgMusic.volume = 0.6;
        bgMusic.play().then(() => {
          musicPlaying = true;
          musicToggle.classList.add('playing');
        }).catch(() => {});
      }

      function doOpen() {
        if (started) return;
        started = true;

        playMusic();

        openBtn.classList.add('hide');

        dotsEl.classList.add('show');
        musicToggle.classList.add('show');

        setTimeout(() => {
          goTo(1);
          resetAuto();
        }, 380);
      }

      openBtn.addEventListener('click', doOpen);

      musicToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!bgMusic) return;
        if (musicPlaying) {
          bgMusic.pause();
          musicPlaying = false;
          musicToggle.classList.remove('playing');
        } else {
          bgMusic.volume = 0.6;
          bgMusic.play().then(() => {
            musicPlaying = true;
            musicToggle.classList.add('playing');
          }).catch(() => {});
        }
      });

      // ========================================================
      //  四、图片渐显（预加载已完成，这里只做渐显）
      // ========================================================
      function bindImageFade(img) {
        const page = img.closest('.page');
        if (!page) return;
        const markLoaded = () => {
          img.classList.add('loaded');
          page.classList.remove('loading');
        };
        if (img.complete && img.naturalWidth > 0) {
          markLoaded();
        } else {
          img.addEventListener('load', markLoaded);
          img.addEventListener('error', markLoaded);
        }
      }
      document.querySelectorAll('.page img').forEach(bindImageFade);

      // ========================================================
      //  五、爱心粒子（最后一页）
      // ========================================================
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const titleEl = document.getElementById('titleText');
      let particles = [];
      let mouse = { x: -9999, y: -9999 };
      let mouseActive = false;
      let particleStarted = false;

      function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        initParticles();
        adjustTitleFontSize();
      }

      function adjustTitleFontSize() {
        if (!titleEl) return;
        const containerWidth = window.innerWidth;
        const maxWidth = containerWidth * 0.9;
        const baseFontSize = 16;
        titleEl.style.fontSize = baseFontSize + 'px';
        const textWidth = titleEl.scrollWidth;
        if (textWidth === 0) return;
        let newFontSize = baseFontSize * (maxWidth / textWidth);
        const minFontSize = 32, maxFontSize = 160;
        newFontSize = Math.min(maxFontSize, Math.max(minFontSize, newFontSize));
        const maxHeight = window.innerHeight * 0.25;
        if (newFontSize > maxHeight) newFontSize = Math.min(newFontSize, maxHeight);
        titleEl.style.fontSize = newFontSize + 'px';
        titleEl.style.lineHeight = '1.2';
      }

      function initParticles() {
        particles = [];
        const count = Math.floor((canvas.width * canvas.height) / 3500);
        const finalCount = Math.max(80, Math.min(count, 400));
        for (let i = 0; i < finalCount; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            baseVx: 0, baseVy: 0,
            size: Math.random() * 6 + 4,
            alpha: Math.random() * 0.3 + 0.12,
            rotation: Math.random() * Math.PI * 2
          });
          const p = particles[particles.length - 1];
          p.baseVx = p.vx;
          p.baseVy = p.vy;
        }
      }

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX; mouse.y = e.clientY; mouseActive = true;
      });
      window.addEventListener('mouseleave', () => {
        mouseActive = false; mouse.x = -9999; mouse.y = -9999;
      });
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          const t = e.touches[0];
          mouse.x = t.clientX; mouse.y = t.clientY; mouseActive = true;
        }
      }, { passive: true });
      window.addEventListener('touchend', () => {
        mouseActive = false; mouse.x = -9999; mouse.y = -9999;
      });

      function drawHeart(c, x, y, size, rotation, color) {
        c.save();
        c.translate(x, y);
        c.rotate(rotation);
        const s = size / 16;
        c.scale(s, s);
        c.beginPath();
        c.moveTo(0, 4);
        c.bezierCurveTo(0, 0, -8, 0, -8, 6);
        c.bezierCurveTo(-8, 11, -4, 14, 0, 18);
        c.bezierCurveTo(4, 14, 8, 11, 8, 6);
        c.bezierCurveTo(8, 0, 0, 0, 0, 4);
        c.closePath();
        c.fillStyle = color;
        c.fill();
        c.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const hasMouse = mouseActive && mouse.x > -1000 && mouse.y > -1000;

        particles.forEach(p => {
          if (hasMouse) {
            const dx = mouse.x - p.x, dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 180;
            if (dist < maxDist && dist > 0) {
              const force = (1 - dist / maxDist) * 0.12;
              p.vx += (dx / dist) * force;
              p.vy += (dy / dist) * force;
              p.rotation += 0.05;
            }
          }
          p.vx += (p.baseVx - p.vx) * 0.02;
          p.vy += (p.baseVy - p.vy) * 0.02;
          p.rotation += 0.005;
          p.x += p.vx; p.y += p.vy;
          if (p.x < -20) p.x = canvas.width + 20;
          if (p.x > canvas.width + 20) p.x = -20;
          if (p.y < -20) p.y = canvas.height + 20;
          if (p.y > canvas.height + 20) p.y = -20;

          let color;
          if (hasMouse) {
            const dx = mouse.x - p.x, dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 180) {
              const t = 1 - dist / 180;
              const r = Math.round(212 + (255 - 212) * t);
              const g = Math.round(106 + (143 - 106) * t);
              const b = Math.round(146 + (176 - 146) * t);
              color = `rgba(${r}, ${g}, ${b}, ${p.alpha + t * 0.35})`;
            } else {
              color = `rgba(224, 130, 170, ${p.alpha * 0.95})`;
            }
          } else {
            color = `rgba(230, 140, 175, ${p.alpha * 0.9})`;
          }
          drawHeart(ctx, p.x, p.y, p.size, p.rotation, color);
        });

        if (hasMouse) {
          particles.forEach(p => {
            const dx = mouse.x - p.x, dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) {
              ctx.beginPath();
              ctx.moveTo(mouse.x, mouse.y);
              ctx.lineTo(p.x, p.y);
              const t = 1 - dist / 140;
              ctx.strokeStyle = `rgba(235, 130, 175, ${t * 0.28})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          });
        }
        requestAnimationFrame(animate);
      }

      function startParticlesOnce() {
        if (particleStarted) return;
        particleStarted = true;
        resizeCanvas();
        animate();
      }

      window.addEventListener('resize', () => {
        resizeCanvas();
        pagesEl.style.transform = 'translateY(-' + (current * 100) + '%)';
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => adjustTitleFontSize());
      }
      window.addEventListener('load', () => {
        adjustTitleFontSize();
        if (current === total - 1) startParticlesOnce();
      });

      setInterval(() => {
        if (current === total - 1) startParticlesOnce();
      }, 300);
    })();
  </script>
</body>
</html>
