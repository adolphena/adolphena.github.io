<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: default;
    }

    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .title-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      padding: 5vh 4vw;
      box-sizing: border-box;
    }

    .title {
      font-size: clamp(2rem, 10vw, 6rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1d1d1f;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      display: inline-block;
      padding: 0 0.1em;
      transition: font-size 0.1s ease;
    }

    .subtitle {
      font-size: 1.8rem;
      font-weight: 400;
      color: #1d1d1f;
      letter-spacing: 0.08em;
      margin-top: 1.2em;
      white-space: nowrap;
      text-align: center;
      line-height: 1.4;
      transition: font-size 0.1s ease;
    }

    /* ---------- 地图链接按钮组 ---------- */
    .map-links {
      display: flex;
      gap: 12px;
      margin-top: 2em;
      flex-wrap: wrap;
      justify-content: center;
    }

    .map-link {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(255, 100, 150, 0.10);
      border: 1px solid rgba(255, 100, 150, 0.35);
      color: #d6336c;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: all 0.25s ease;
      white-space: nowrap;
      user-select: none;
    }

    .map-link:hover {
      background: rgba(255, 100, 150, 0.20);
      border-color: rgba(255, 100, 150, 0.55);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(255, 100, 150, 0.25);
    }

    .map-link:active {
      transform: translateY(0);
    }

    .map-link svg {
      flex-shrink: 0;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      body {
        cursor: auto;
      }
      .subtitle {
        font-size: 1.3rem;
        margin-top: 1em;
      }
      .map-links {
        margin-top: 1.5em;
        gap: 10px;
      }
      .map-link {
        padding: 9px 18px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  <div class="title-wrapper">
    <div class="title" id="titleText">别来无恙啊</div>
    <div class="subtitle">季晨阳 &amp; 许慧敏</div>
    <div class="subtitle">2026.11.14</div>
    <div class="subtitle">富东大酒店(园区店)</div>

    <div class="map-links">
      <a class="map-link" href="https://surl.amap.com/88qmZiK1o5t8"
         target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0
                   9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
        </svg>
        高德地图
      </a>

      <a class="map-link" href="https://j.map.baidu.com/a6/2cFM"
         target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0
                   9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
        </svg>
        百度地图
      </a>
    </div>
  </div>

  <script>
    (function() {
      // ---------- 爱心粒子系统 ----------
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let mouse = { x: -9999, y: -9999 };
      let mouseActive = false;

      const titleEl = document.getElementById('titleText');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initParticles();
        adjustTitleFontSize();
      }

      function adjustTitleFontSize() {
        if (!titleEl) return;

        const containerWidth = window.innerWidth;
        const maxWidth = containerWidth * 0.9;

        const baseFontSize = 16;
        titleEl.style.fontSize = baseFontSize + 'px';

        const textWidth = titleEl.scrollWidth;
        if (textWidth === 0) return;

        let newFontSize = baseFontSize * (maxWidth / textWidth);

        const minFontSize = 32;
        const maxFontSize = 160;
        newFontSize = Math.min(maxFontSize, Math.max(minFontSize, newFontSize));

        const maxHeight = window.innerHeight * 0.25;
        if (newFontSize > maxHeight) {
          newFontSize = Math.min(newFontSize, maxHeight);
        }

        titleEl.style.fontSize = newFontSize + 'px';
        titleEl.style.lineHeight = '1.2';
      }

      function initParticles() {
        particles = [];
        const count = Math.floor((canvas.width * canvas.height) / 3500);
        const finalCount = Math.max(80, Math.min(count, 400));

        for (let i = 0; i < finalCount; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            baseVx: 0,
            baseVy: 0,
            size: Math.random() * 6 + 4,
            alpha: Math.random() * 0.3 + 0.1,
            rotation: Math.random() * Math.PI * 2
          });
          const p = particles[particles.length - 1];
          p.baseVx = p.vx;
          p.baseVy = p.vy;
        }
      }

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouseActive = true;
      });

      window.addEventListener('mouseleave', () => {
        mouseActive = false;
        mouse.x = -9999;
        mouse.y = -9999;
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          const touch = e.touches[0];
          mouse.x = touch.clientX;
          mouse.y = touch.clientY;
          mouseActive = true;
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        mouseActive = false;
        mouse.x = -9999;
        mouse.y = -9999;
      });

      function drawHeart(ctx, x, y, size, rotation, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        const s = size / 16;
        ctx.scale(s, s);

        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.bezierCurveTo(0, 0, -8, 0, -8, 6);
        ctx.bezierCurveTo(-8, 11, -4, 14, 0, 18);
        ctx.bezierCurveTo(4, 14, 8, 11, 8, 6);
        ctx.bezierCurveTo(8, 0, 0, 0, 0, 4);
        ctx.closePath();

        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const hasMouse = mouseActive && mouse.x > -1000 && mouse.y > -1000;

        particles.forEach(p => {
          if (hasMouse) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 180;

            if (dist < maxDist && dist > 0) {
              const force = (1 - dist / maxDist) * 0.12;
              p.vx += (dx / dist) * force;
              p.vy += (dy / dist) * force;
              p.rotation += 0.05;
            }
          }

          p.vx += (p.baseVx - p.vx) * 0.02;
          p.vy += (p.baseVy - p.vy) * 0.02;
          p.rotation += 0.005;

          p.x += p.vx;
          p.y += p.vy;

          if (p.x < -20) p.x = canvas.width + 20;
          if (p.x > canvas.width + 20) p.x = -20;
          if (p.y < -20) p.y = canvas.height + 20;
          if (p.y > canvas.height + 20) p.y = -20;

          let color;
          if (hasMouse) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 180) {
              const t = 1 - dist / 180;
              const r = Math.round(29 + (255 - 29) * t);
              const g = Math.round(29 + (100 - 29) * t);
              const b = Math.round(31 + (150 - 31) * t);
              color = `rgba(${r}, ${g}, ${b}, ${p.alpha + t * 0.5})`;
            } else {
              color = `rgba(29, 29, 31, ${p.alpha})`;
            }
          } else {
            color = `rgba(29, 29, 31, ${p.alpha})`;
          }

          drawHeart(ctx, p.x, p.y, p.size, p.rotation, color);
        });

        if (hasMouse) {
          particles.forEach(p => {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) {
              ctx.beginPath();
              ctx.moveTo(mouse.x, mouse.y);
              ctx.lineTo(p.x, p.y);
              const t = 1 - dist / 140;
              ctx.strokeStyle = `rgba(255, 100, 150, ${t * 0.15})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          });
        }

        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', () => {
        resize();
      });

      function init() {
        resize();
        animate();
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          adjustTitleFontSize();
        });
      }

      window.addEventListener('load', () => {
        adjustTitleFontSize();
      });

      init();

      let lastWidth = window.innerWidth;
      setInterval(() => {
        if (window.innerWidth !== lastWidth) {
          lastWidth = window.innerWidth;
          adjustTitleFontSize();
        }
      }, 250);

    })();
  </script>
</body>
</html>
