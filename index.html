<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>季晨阳 & 许慧敏 · 婚礼邀请</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 粉色渐变背景：中心更透亮，边缘更粉嫩 */
      background: radial-gradient(circle at 50% 45%, #fff8fb 0%, #ffe4ee 55%, #ffd0e0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: default;
    }

    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .title-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      padding: 5vh 4vw;
      box-sizing: border-box;
    }

    /* 主标题：深玫红，有分量 */
    .title {
      font-size: clamp(2rem, 10vw, 6rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #9e2f58;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      display: inline-block;
      padding: 0 0.1em;
      transition: font-size 0.1s ease;
      text-shadow: 0 2px 16px rgba(255, 200, 220, 0.8);
    }

    /* 婚礼小标签 */
    .wedding-tag {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      color: #b86a88;
      margin-top: 0.9em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(255, 220, 235, 0.9);
    }

    /* 人名：比副标题更突出 */
    .names {
      font-size: 1.8rem;
      font-weight: 500;
      color: #7a3a52;
      letter-spacing: 0.12em;
      margin-top: 1.2em;
      white-space: nowrap;
      text-align: center;
      line-height: 1.4;
      transition: font-size 0.1s ease;
      text-shadow: 0 1px 8px rgba(255, 220, 235, 0.9);
    }

    /* 时间地点：更小更淡，形成层级 */
    .subtitle {
      font-size: 1.25rem;
      font-weight: 400;
      color: #8b5f70;
      letter-spacing: 0.06em;
      margin-top: 0.7em;
      white-space: nowrap;
      text-align: center;
      line-height: 1.5;
      transition: font-size 0.1s ease;
      text-shadow: 0 1px 6px rgba(255, 225, 238, 0.9);
    }

    /* ---------- 地图链接按钮组 ---------- */
    .map-links {
      display: flex;
      gap: 14px;
      margin-top: 2.2em;
      flex-wrap: wrap;
      justify-content: center;
    }

    .map-link {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 24px;
      border-radius: 999px;
      /* 按钮更实，对比度更高 */
      background: rgba(255, 248, 252, 0.96);
      border: 1px solid rgba(180, 80, 130, 0.45);
      /* 文字更深，保证可读性 */
      color: #8a2450;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: all 0.25s ease;
      white-space: nowrap;
      user-select: none;
      box-shadow: 0 2px 10px rgba(200, 120, 150, 0.15);
    }

    .map-link:hover {
      background: #fff0f6;
      border-color: rgba(160, 60, 110, 0.75);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(210, 110, 155, 0.28);
    }

    .map-link:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(210, 110, 155, 0.2);
    }

    .map-link svg {
      flex-shrink: 0;
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      body {
        cursor: auto;
      }
      .wedding-tag {
        font-size: 0.8rem;
        letter-spacing: 0.3em;
      }
      .names {
        font-size: 1.35rem;
        margin-top: 1em;
      }
      .subtitle {
        font-size: 1rem;
        margin-top: 0.6em;
        white-space: normal; /* 窄屏允许换行，防止溢出 */
        max-width: 90vw;
      }
      .map-links {
        margin-top: 1.8em;
        gap: 10px;
      }
      .map-link {
        padding: 10px 18px;
        font-size: 0.9rem;
      }
      .title {
        text-shadow: 0 1px 10px rgba(255, 210, 225, 0.9);
      }
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  <div class="title-wrapper">
    <div class="title" id="titleText">别来无恙啊</div>
    <div class="wedding-tag">Wedding Invitation</div>
    <div class="names">季晨阳 ♡ 许慧敏</div>
    <div class="subtitle">2026.11.14（周六）午宴</div>
    <div class="subtitle">富东大酒店（园区店）</div>

    <div class="map-links">
      <a class="map-link" href="https://surl.amap.com/88qmZiK1o5t8"
         target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0
                   9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
        </svg>
        高德导航
      </a>

      <a class="map-link" href="https://j.map.baidu.com/a6/2cFM"
         target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0
                   9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
        </svg>
        百度导航
      </a>
    </div>
  </div>

  <script>
    (function() {
      // ---------- 爱心粒子系统 ----------
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let mouse = { x: -9999, y: -9999 };
      let mouseActive = false;

      const titleEl = document.getElementById('titleText');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initParticles();
        adjustTitleFontSize();
      }

      function adjustTitleFontSize() {
        if (!titleEl) return;

        const containerWidth = window.innerWidth;
        const maxWidth = containerWidth * 0.9;

        const baseFontSize = 16;
        titleEl.style.fontSize = baseFontSize + 'px';

        const textWidth = titleEl.scrollWidth;
        if (textWidth === 0) return;

        let newFontSize = baseFontSize * (maxWidth / textWidth);

        const minFontSize = 32;
        const maxFontSize = 160;
        newFontSize = Math.min(maxFontSize, Math.max(minFontSize, newFontSize));

        const maxHeight = window.innerHeight * 0.25;
        if (newFontSize > maxHeight) {
          newFontSize = Math.min(newFontSize, maxHeight);
        }

        titleEl.style.fontSize = newFontSize + 'px';
        titleEl.style.lineHeight = '1.2';
      }

      function initParticles() {
        particles = [];
        const count = Math.floor((canvas.width * canvas.height) / 3500);
        const finalCount = Math.max(80, Math.min(count, 400));

        for (let i = 0; i < finalCount; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            baseVx: 0,
            baseVy: 0,
            size: Math.random() * 6 + 4,
            alpha: Math.random() * 0.3 + 0.12,
            rotation: Math.random() * Math.PI * 2
          });
          const p = particles[particles.length - 1];
          p.baseVx = p.vx;
          p.baseVy = p.vy;
        }
      }

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouseActive = true;
      });

      window.addEventListener('mouseleave', () => {
        mouseActive = false;
        mouse.x = -9999;
        mouse.y = -9999;
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          const touch = e.touches[0];
          mouse.x = touch.clientX;
          mouse.y = touch.clientY;
          mouseActive = true;
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        mouseActive = false;
        mouse.x = -9999;
        mouse.y = -9999;
      });

      function drawHeart(ctx, x, y, size, rotation, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        const s = size / 16;
        ctx.scale(s, s);

        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.bezierCurveTo(0, 0, -8, 0, -8, 6);
        ctx.bezierCurveTo(-8, 11, -4, 14, 0, 18);
        ctx.bezierCurveTo(4, 14, 8, 11, 8, 6);
        ctx.bezierCurveTo(8, 0, 0, 0, 0, 4);
        ctx.closePath();

        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const hasMouse = mouseActive && mouse.x > -1000 && mouse.y > -1000;

        particles.forEach(p => {
          if (hasMouse) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 180;

            if (dist < maxDist && dist > 0) {
              const force = (1 - dist / maxDist) * 0.12;
              p.vx += (dx / dist) * force;
              p.vy += (dy / dist) * force;
              p.rotation += 0.05;
            }
          }

          p.vx += (p.baseVx - p.vx) * 0.02;
          p.vy += (p.baseVy - p.vy) * 0.02;
          p.rotation += 0.005;

          p.x += p.vx;
          p.y += p.vy;

          if (p.x < -20) p.x = canvas.width + 20;
          if (p.x > canvas.width + 20) p.x = -20;
          if (p.y < -20) p.y = canvas.height + 20;
          if (p.y > canvas.height + 20) p.y = -20;

          let color;
          // 粒子颜色：柔和的粉 / 珊瑚粉，更明亮
          if (hasMouse) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 180) {
              const t = 1 - dist / 180;
              // 从暖粉 #d46a92 渐变到亮珊瑚粉 #ff8fb0
              const r = Math.round(212 + (255 - 212) * t);
              const g = Math.round(106 + (143 - 106) * t);
              const b = Math.round(146 + (176 - 146) * t);
              color = `rgba(${r}, ${g}, ${b}, ${p.alpha + t * 0.35})`;
            } else {
              color = `rgba(224, 130, 170, ${p.alpha * 0.95})`;
            }
          } else {
            // 无交互时也是柔粉，不显脏
            color = `rgba(230, 140, 175, ${p.alpha * 0.9})`;
          }

          drawHeart(ctx, p.x, p.y, p.size, p.rotation, color);
        });

        if (hasMouse) {
          particles.forEach(p => {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) {
              ctx.beginPath();
              ctx.moveTo(mouse.x, mouse.y);
              ctx.lineTo(p.x, p.y);
              const t = 1 - dist / 140;
              // 连接线浅粉
              ctx.strokeStyle = `rgba(235, 130, 175, ${t * 0.28})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          });
        }

        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', () => {
        resize();
      });

      function init() {
        resize();
        animate();
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          adjustTitleFontSize();
        });
      }

      window.addEventListener('load', () => {
        adjustTitleFontSize();
      });

      init();

      let lastWidth = window.innerWidth;
      setInterval(() => {
        if (window.innerWidth !== lastWidth) {
          lastWidth = window.innerWidth;
          adjustTitleFontSize();
        }
      }, 250);

    })();
  </script>
</body>
</html>
