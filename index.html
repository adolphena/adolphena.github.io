<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>季晨阳 & 许慧敏 · 婚礼邀请</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #fff8fb 0%, #ffe4ee 55%, #ffd0e0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* ---------- 滑动容器 ---------- */
    #pages {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      transition: transform 0.75s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }

    /* 每一页统一模板：想加页就复制这个 section */
    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ---------- 婚纱照页 ---------- */
    .photo-page {
      padding: 0;
      background: transparent;
    }

    .photo-page picture {
      display: block;
      width: 100%;
      height: 100%;
    }

    .photo-page img {
      width: 100%;
      height: 100%;
      /* contain：完整显示不裁剪，四周留白由粉色背景填充，像相框 */
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ---------- 请柬页（原页面内容） ---------- */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .invite-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 5vh 4vw;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .title {
      font-size: clamp(2rem, 10vw, 6rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #9e2f58;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      display: inline-block;
      padding: 0 0.1em;
      transition: font-size 0.1s ease;
      text-shadow: 0 2px 16px rgba(255, 200, 220, 0.8);
    }

    .wedding-tag {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      color: #b86a88;
      margin-top: 0.9em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(255, 220, 235, 0.9);
    }

    .names {
      font-size: 1.8rem;
      font-weight: 500;
      color: #7a3a52;
      letter-spacing: 0.12em;
      margin-top: 1.2em;
      white-space: nowrap;
      text-align: center;
      line-height: 1.4;
      transition: font-size 0.1s ease;
      text-shadow: 0 1px 8px rgba(255, 220, 235, 0.9);
    }

    .subtitle {
      font-size: 1.25rem;
      font-weight: 400;
      color: #8b5f70;
      letter-spacing: 0.06em;
      margin-top: 0.7em;
      white-space: nowrap;
      text-align: center;
      line-height: 1.5;
      transition: font-size 0.1s ease;
      text-shadow: 0 1px 6px rgba(255, 225, 238, 0.9);
    }

    .map-links {
      display: flex;
      gap: 14px;
      margin-top: 2.2em;
      flex-wrap: wrap;
      justify-content: center;
    }

    .map-link {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 24px;
      border-radius: 999px;
      background: rgba(255, 248, 252, 0.96);
      border: 1px solid rgba(180, 80, 130, 0.45);
      color: #8a2450;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: all 0.25s ease;
      white-space: nowrap;
      user-select: none;
      box-shadow: 0 2px 10px rgba(200, 120, 150, 0.15);
    }

    .map-link:hover {
      background: #fff0f6;
      border-color: rgba(160, 60, 110, 0.75);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(210, 110, 155, 0.28);
    }

    .map-link:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(210, 110, 155, 0.2);
    }

    .map-link svg {
      flex-shrink: 0;
      opacity: 0.9;
    }

    /* ---------- 右侧页码圆点 ---------- */
    .dots {
      position: fixed;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(180, 90, 130, 0.28);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #b0416e;
      transform: scale(1.35);
    }

    /* ---------- 上滑提示 ---------- */
    .swipe-hint {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #b86a88;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      animation: bounce 2s infinite;
    }

    .swipe-hint.show {
      opacity: 0.85;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    /* ---------- 移动端适配 ---------- */
    @media (max-width: 600px) {
      .wedding-tag {
        font-size: 0.8rem;
        letter-spacing: 0.3em;
      }
      .names {
        font-size: 1.35rem;
        margin-top: 1em;
      }
      .subtitle {
        font-size: 1rem;
        margin-top: 0.6em;
        white-space: normal;
        max-width: 90vw;
      }
      .map-links {
        margin-top: 1.8em;
        gap: 10px;
      }
      .map-link {
        padding: 10px 18px;
        font-size: 0.9rem;
      }
      .title {
        text-shadow: 0 1px 10px rgba(255, 210, 225, 0.9);
      }
      .dots {
        right: 10px;
      }
    }
  </style>
</head>
<body>

  <div id="pages">

    <!-- ===== 第 1 页：婚纱照 ===== -->
    <!-- 想加页：复制下面整段 section，改图片名即可 -->
    <section class="page photo-page">
      <picture>
        <!-- 手机（窄屏）加载竖版图，没有就自动回落到下面的 img -->
        <source media="(max-width: 768px)" srcset="photo-1-mobile.jpg">
        <img src="photo-1.jpg" alt="婚纱照 1">
      </picture>
    </section>

    <!-- ===== 第 2 页：婚纱照 ===== -->
    <section class="page photo-page">
      <picture>
        <source media="(max-width: 768px)" srcset="photo-2-mobile.jpg">
        <img src="photo-2.jpg" alt="婚纱照 2">
      </picture>
    </section>

    <!-- ===== 第 3 页：婚纱照 ===== -->
    <section class="page photo-page">
      <picture>
        <source media="(max-width: 768px)" srcset="photo-3-mobile.jpg">
        <img src="photo-3.jpg" alt="婚纱照 3">
      </picture>
    </section>

    <!-- ===== 请柬（最后一页） ===== -->
    <section class="page invite-page">
      <canvas id="canvas"></canvas>
      <div class="invite-content">
        <div class="title" id="titleText">别来无恙啊</div>
        <div class="wedding-tag">Wedding Invitation</div>
        <div class="names">季晨阳 ♡ 许慧敏</div>
        <div class="subtitle">2026.11.14（周六）午宴</div>
        <div class="subtitle">富东大酒店（园区店）</div>

        <div class="map-links">
          <a class="map-link" href="https://surl.amap.com/88qmZiK1o5t8"
             target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0
                       9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
            高德导航
          </a>

          <a class="map-link" href="https://j.map.baidu.com/a6/2cFM"
             target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0
                       9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
            百度导航
          </a>
        </div>
      </div>
    </section>

  </div>

  <!-- 右侧页码圆点 -->
  <div class="dots" id="dots"></div>

  <!-- 上滑提示 -->
  <div class="swipe-hint" id="swipeHint">上滑查看 ↑</div>

  <script>
    (function() {
      // ========================================================
      //  一、整页滑动控制
      // ========================================================
      const pagesEl = document.getElementById('pages');
      const pageEls = Array.from(pagesEl.querySelectorAll('.page'));
      const dotsEl = document.getElementById('dots');
      const swipeHint = document.getElementById('swipeHint');
      const total = pageEls.length;

      let current = 0;              // 当前页
      let animating = false;        // 动画中锁，防连点
      let autoTimer = null;         // 自动翻页计时器
      const AUTO_DELAY = 5000;      // 5 秒无操作自动翻页
      const ANIM_DURATION = 750;    // 与 CSS transition 时长一致

      // 生成圆点
      pageEls.forEach((_, i) => {
        const b = document.createElement('button');
        b.className = 'dot' + (i === 0 ? ' active' : '');
        b.setAttribute('aria-label', '第 ' + (i + 1) + ' 页');
        b.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(b);
      });
      const dotEls = Array.from(dotsEl.children);

      // 切换页
      function goTo(index) {
        if (animating) return;
        index = Math.max(0, Math.min(total - 1, index));
        if (index === current) {
          resetAuto();
          return;
        }
        animating = true;
        current = index;
        pagesEl.style.transform = 'translateY(-' + (current * 100) + '%)';

        dotEls.forEach((d, i) => d.classList.toggle('active', i === current));
        updateHint();

        // 到最后一页：不再自动翻
        if (current === total - 1) {
          clearAuto();
        } else {
          resetAuto();
        }

        setTimeout(() => { animating = false; }, ANIM_DURATION);
      }

      function next() { goTo(current + 1); }
      function prev() { goTo(current - 1); }

      // 提示只在第 1 页显示
      function updateHint() {
        if (current === 0 && total > 1) {
          swipeHint.classList.add('show');
        } else {
          swipeHint.classList.remove('show');
        }
      }

      // ---------- 自动翻页 ----------
      function clearAuto() {
        if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
      }
      function resetAuto() {
        clearAuto();
        // 最后一页不自动翻
        if (current >= total - 1) return;
        autoTimer = setTimeout(() => {
          // 时间到自动滑到下一页
          if (!animating) next();
          else resetAuto();
        }, AUTO_DELAY);
      }

      // ---------- 滚轮（电脑） ----------
      let wheelLock = false;
      window.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) < 8) return;
        if (wheelLock) return;
        wheelLock = true;
        setTimeout(() => { wheelLock = false; }, ANIM_DURATION);

        if (e.deltaY > 0) next();
        else prev();
      }, { passive: true });

      // ---------- 触摸（手机） ----------
      let touchStartY = 0;
      let touching = false;
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        touchStartY = e.touches[0].clientY;
        touching = true;
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!touching) return;
        const dy = e.touches[0].clientY - touchStartY;
        // 滑动超过 50px 就翻页（并防止一次滑动翻多页）
        if (Math.abs(dy) > 50) {
          touching = false;
          if (dy < 0) next();
          else prev();
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        touching = false;
      }, { passive: true });

      // ---------- 键盘（可选，方便电脑调试） ----------
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'PageDown') next();
        if (e.key === 'ArrowUp' || e.key === 'PageUp') prev();
      });

      // 启动
      updateHint();
      resetAuto();

      // ========================================================
      //  二、爱心粒子动画（原逻辑，只作用于最后一页 canvas）
      // ========================================================
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const titleEl = document.getElementById('titleText');
      let particles = [];
      let mouse = { x: -9999, y: -9999 };
      let mouseActive = false;
      let particleStarted = false;

      function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        initParticles();
        adjustTitleFontSize();
      }

      function adjustTitleFontSize() {
        if (!titleEl) return;
        const containerWidth = window.innerWidth;
        const maxWidth = containerWidth * 0.9;
        const baseFontSize = 16;
        titleEl.style.fontSize = baseFontSize + 'px';
        const textWidth = titleEl.scrollWidth;
        if (textWidth === 0) return;
        let newFontSize = baseFontSize * (maxWidth / textWidth);
        const minFontSize = 32;
        const maxFontSize = 160;
        newFontSize = Math.min(maxFontSize, Math.max(minFontSize, newFontSize));
        const maxHeight = window.innerHeight * 0.25;
        if (newFontSize > maxHeight) newFontSize = Math.min(newFontSize, maxHeight);
        titleEl.style.fontSize = newFontSize + 'px';
        titleEl.style.lineHeight = '1.2';
      }

      function initParticles() {
        particles = [];
        const count = Math.floor((canvas.width * canvas.height) / 3500);
        const finalCount = Math.max(80, Math.min(count, 400));
        for (let i = 0; i < finalCount; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            baseVx: 0,
            baseVy: 0,
            size: Math.random() * 6 + 4,
            alpha: Math.random() * 0.3 + 0.12,
            rotation: Math.random() * Math.PI * 2
          });
          const p = particles[particles.length - 1];
          p.baseVx = p.vx;
          p.baseVy = p.vy;
        }
      }

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouseActive = true;
      });
      window.addEventListener('mouseleave', () => {
        mouseActive = false;
        mouse.x = -9999;
        mouse.y = -9999;
      });
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          const t = e.touches[0];
          mouse.x = t.clientX;
          mouse.y = t.clientY;
          mouseActive = true;
        }
      }, { passive: true });
      window.addEventListener('touchend', () => {
        mouseActive = false;
        mouse.x = -9999;
        mouse.y = -9999;
      });

      function drawHeart(ctx, x, y, size, rotation, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        const s = size / 16;
        ctx.scale(s, s);
        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.bezierCurveTo(0, 0, -8, 0, -8, 6);
        ctx.bezierCurveTo(-8, 11, -4, 14, 0, 18);
        ctx.bezierCurveTo(4, 14, 8, 11, 8, 6);
        ctx.bezierCurveTo(8, 0, 0, 0, 0, 4);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const hasMouse = mouseActive && mouse.x > -1000 && mouse.y > -1000;

        particles.forEach(p => {
          if (hasMouse) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 180;
            if (dist < maxDist && dist > 0) {
              const force = (1 - dist / maxDist) * 0.12;
              p.vx += (dx / dist) * force;
              p.vy += (dy / dist) * force;
              p.rotation += 0.05;
            }
          }
          p.vx += (p.baseVx - p.vx) * 0.02;
          p.vy += (p.baseVy - p.vy) * 0.02;
          p.rotation += 0.005;
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < -20) p.x = canvas.width + 20;
          if (p.x > canvas.width + 20) p.x = -20;
          if (p.y < -20) p.y = canvas.height + 20;
          if (p.y > canvas.height + 20) p.y = -20;

          let color;
          if (hasMouse) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 180) {
              const t = 1 - dist / 180;
              const r = Math.round(212 + (255 - 212) * t);
              const g = Math.round(106 + (143 - 106) * t);
              const b = Math.round(146 + (176 - 146) * t);
              color = `rgba(${r}, ${g}, ${b}, ${p.alpha + t * 0.35})`;
            } else {
              color = `rgba(224, 130, 170, ${p.alpha * 0.95})`;
            }
          } else {
            color = `rgba(230, 140, 175, ${p.alpha * 0.9})`;
          }
          drawHeart(ctx, p.x, p.y, p.size, p.rotation, color);
        });

        if (hasMouse) {
          particles.forEach(p => {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) {
              ctx.beginPath();
              ctx.moveTo(mouse.x, mouse.y);
              ctx.lineTo(p.x, p.y);
              const t = 1 - dist / 140;
              ctx.strokeStyle = `rgba(235, 130, 175, ${t * 0.28})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          });
        }
        requestAnimationFrame(animate);
      }

      function startParticlesOnce() {
        if (particleStarted) return;
        particleStarted = true;
        resizeCanvas();
        animate();
      }

      window.addEventListener('resize', () => {
        resizeCanvas();
        // 重算当前页位置（防止旋转屏幕后错位）
        pagesEl.style.transform = 'translateY(-' + (current * 100) + '%)';
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => adjustTitleFontSize());
      }
      window.addEventListener('load', () => {
        adjustTitleFontSize();
        // 首屏如果是请柬页（比如你只留 1 页）也启动动画
        if (current === total - 1) startParticlesOnce();
      });

      // 每次切到最后一页时，确保动画在跑
      const origGoTo = goTo;
      window.__checkParticleStart = function() {
        if (current === total - 1) startParticlesOnce();
      };
      // 给 goTo 挂钩：切到最后一页启动粒子
      const pagesObserver = setInterval(() => {
        if (current === total - 1) {
          startParticlesOnce();
        }
      }, 300);

    })();
  </script>
</body>
</html>
