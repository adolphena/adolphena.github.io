<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    cursor: default;
  }

  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
    z-index: 1;
  }

  .title {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(3.5em, 12vw, 10em);
    font-weight: 600;
    letter-spacing: -0.03em;
    color: #1d1d1f;
    z-index: 2;
    pointer-events: none;
    user-select: none;
  }

  @media (max-width: 600px) {
    body { cursor: auto; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="title">别来无恙啊!</div>

<script>
/* ========== 爱心粒子系统 ========== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let mouse = { x: -9999, y: -9999 };
let mouseActive = false;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initParticles();
}
window.addEventListener('resize', resize);

function initParticles() {
  particles = [];
  // 保持之前的粒子密度
  const count = Math.floor((canvas.width * canvas.height) / 3000);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      baseVx: 0,
      baseVy: 0,
      // 爱心尺寸稍微调大一点点，否则看不清形状
      size: Math.random() * 6 + 4, 
      alpha: Math.random() * 0.3 + 0.1,
      // 为每颗爱心加一个微小的旋转角度，更自然
      rotation: Math.random() * Math.PI * 2
    });
    const p = particles[particles.length - 1];
    p.baseVx = p.vx;
    p.baseVy = p.vy;
  }
}

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouseActive = true;
});
window.addEventListener('mouseleave', () => {
  mouseActive = false;
});

/* ---- 核心：绘制爱心的方法 ---- */
function drawHeart(ctx, x, y, size, rotation, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  // 缩放，让爱心大小合适
  const s = size / 16; 
  ctx.scale(s, s);

  ctx.beginPath();
  // 使用贝塞尔曲线画爱心
  ctx.moveTo(0, 4);
  ctx.bezierCurveTo(0, 0, -8, 0, -8, 6);
  ctx.bezierCurveTo(-8, 11, -4, 14, 0, 18);
  ctx.bezierCurveTo(4, 14, 8, 11, 8, 6);
  ctx.bezierCurveTo(8, 0, 0, 0, 0, 4);
  ctx.closePath();

  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    /* ---- 鼠标吸引力 ---- */
    if (mouseActive) {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const maxDist = 180; // 影响范围

      if (dist < maxDist && dist > 0) {
        const force = (1 - dist / maxDist) * 0.12; // 吸引力稍微调大，爱心跟随更明显
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force;
        // 鼠标靠近时，爱心轻微旋转，增加灵动感
        p.rotation += 0.05;
      }
    }

    /* ---- 恢复自由速度 ---- */
    p.vx += (p.baseVx - p.vx) * 0.02;
    p.vy += (p.baseVy - p.vy) * 0.02;

    /* ---- 自由漂浮时，爱心缓慢自转 ---- */
    p.rotation += 0.005;

    /* ---- 更新位置 ---- */
    p.x += p.vx;
    p.y += p.vy;

    /* ---- 边界穿越 ---- */
    if (p.x < -20) p.x = canvas.width + 20;
    if (p.x > canvas.width + 20) p.x = -20;
    if (p.y < -20) p.y = canvas.height + 20;
    if (p.y > canvas.height + 20) p.y = -20;

    /* ---- 绘制爱心 ---- */
    // 颜色：平时是极淡的深灰色，鼠标靠近时渐变为柔和的粉色
    let color;
    if (mouseActive) {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 180) {
        const t = 1 - dist / 180;
        // 从深灰(29,29,31)渐变到粉红(255,100,150)
        const r = Math.round(29 + (255 - 29) * t);
        const g = Math.round(29 + (100 - 29) * t);
        const b = Math.round(31 + (150 - 31) * t);
        color = `rgba(${r}, ${g}, ${b}, ${p.alpha + t * 0.5})`;
      } else {
        color = `rgba(29, 29, 31, ${p.alpha})`;
      }
    } else {
      color = `rgba(29, 29, 31, ${p.alpha})`;
    }

    drawHeart(ctx, p.x, p.y, p.size, p.rotation, color);
  });

  /* ---- 鼠标和附近爱心粒子的连线 ---- */
  if (mouseActive) {
    particles.forEach(p => {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 140) {
        ctx.beginPath();
        ctx.moveTo(mouse.x, mouse.y);
        ctx.lineTo(p.x, p.y);
        // 连线也带一点淡淡的粉
        const t = 1 - dist / 140;
        ctx.strokeStyle = `rgba(255, 100, 150, ${t * 0.15})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    });
  }

  requestAnimationFrame(animate);
}

resize();
animate();
</script>
</body>
</html>
