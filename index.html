<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light only">
<title>季晨阳 & 许慧敏 · 婚礼邀请</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(circle at 50% 45%, #fff8fb 0%, #ffe4ee 55%, #ffd0e0 100%);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

/* ---------- 页面切换 ---------- */
.page {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease;
  overflow: hidden;
}
.page.active { opacity: 1; pointer-events: auto; }

/* =====================================================
   封面页
   ===================================================== */
#coverPage { justify-content: flex-end; }
#coverPage img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: center 40%;
  user-select: none; -webkit-user-drag: none;
  opacity: 0; transition: opacity .9s ease;
}
#coverPage img.loaded { opacity: 1; }
#coverPage::before {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 58%;
  background: linear-gradient(to bottom,
    rgba(255,248,251,0) 0%, rgba(255,235,244,.55) 45%,
    rgba(255,224,238,.88) 75%, rgba(255,216,233,.97) 100%);
  z-index: 1;
}
.cover-title {
  position: relative; z-index: 2;
  font-size: clamp(2.4rem, 11vw, 4.5rem); font-weight: 600;
  letter-spacing: .02em; color: #9e2f58;
  text-shadow: 0 2px 18px rgba(255,245,250,.95);
  padding: 0 6vw 9vh;
  text-align: center;
}

/* ---------- 加载进度 / 开启按钮 ---------- */
.open-wrap {
  position: relative; z-index: 2;
  margin-bottom: 9vh;
  width: min(78vw, 320px);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.progress-bar {
  width: 100%; height: 6px; border-radius: 999px;
  background: rgba(180,90,130,.18); overflow: hidden;
}
.progress-fill {
  width: 0%; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #e78bb0, #b0416e);
  transition: width .25s ease;
}
.progress-text {
  font-size: .85rem; letter-spacing: .28em; color: #b86a88;
}
.open-btn {
  display: none; align-items: center; gap: 10px;
  padding: 13px 34px; border-radius: 999px;
  border: 1px solid rgba(160,60,110,.6);
  background: rgba(255,248,252,.95); color: #8a2450;
  font-size: 1rem; font-weight: 500; letter-spacing: .18em;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 4px 16px rgba(200,120,150,.22);
  animation: openBtnPulse 2.6s ease-in-out infinite;
}
.open-btn.show { display: inline-flex; }
.open-btn:active { transform: scale(.97); }
@keyframes openBtnPulse {
  0%,100% { box-shadow: 0 4px 16px rgba(200,120,150,.22); }
  50%     { box-shadow: 0 4px 24px rgba(210,110,155,.45); }
}

/* =====================================================
   请柬页
   ===================================================== */
#invitePage {
  justify-content: flex-start;
  padding: 3vh 5vw 5vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#canvas {
  position: fixed; inset: 0; z-index: 0;
  width: 100%; height: 100%;
  display: block; pointer-events: none;
}
.invite-inner {
  position: relative; z-index: 1;
  width: 100%;
  display: flex; flex-direction: column;
  align-items: center; text-align: center;
}

/* 请柬顶部小图 */
.invite-photo {
  width: min(70vw, 280px);
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 16px;
  box-shadow: 0 8px 28px rgba(200,120,150,.28);
  margin-bottom: 4vh;
  user-select: none; -webkit-user-drag: none;
  opacity: 0; transition: opacity .8s ease;
}
.invite-photo.loaded { opacity: 1; }

.invite-title {
  font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: 600;
  color: #9e2f58; line-height: 1.3; white-space: nowrap;
  text-shadow: 0 2px 16px rgba(255,200,220,.8);
}
.wedding-tag {
  font-size: .8rem; font-weight: 500; letter-spacing: .35em;
  color: #b86a88; margin-top: .9em; text-transform: uppercase;
}
.names {
  font-size: 1.35rem; font-weight: 500; color: #7a3a52;
  letter-spacing: .12em; margin-top: 1em; white-space: nowrap;
}
.subtitle {
  font-size: 1rem; color: #8b5f70; letter-spacing: .06em;
  margin-top: .6em; text-align: center;
}
.map-links {
  display: flex; gap: 10px; margin-top: 1.8em;
  flex-wrap: wrap; justify-content: center;
}
.map-link {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 999px;
  background: rgba(255,248,252,.96);
  border: 1px solid rgba(180,80,130,.45);
  color: #8a2450; font-size: .9rem; font-weight: 500;
  letter-spacing: .06em; text-decoration: none;
  white-space: nowrap; user-select: none;
  box-shadow: 0 2px 10px rgba(200,120,150,.15);
  transition: transform .2s ease;
}
.map-link:active { transform: scale(.96); }
.map-link svg { flex-shrink: 0; opacity: .9; }

/* ---------- 音乐开关 ---------- */
.music-toggle {
  position: fixed; top: 14px; right: 14px; z-index: 20;
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid rgba(180,80,130,.35);
  background: rgba(255,248,252,.9); color: #9e2f58;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 2px 10px rgba(200,120,150,.18);
  -webkit-tap-highlight-color: transparent;
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease, transform .25s ease;
}
.music-toggle.show { opacity: 1; pointer-events: auto; }
.music-toggle:active { transform: scale(.94); }
.music-toggle .icon-music { display: none; }
.music-toggle .icon-muted { display: block; }
.music-toggle.playing .icon-music { display: block; }
.music-toggle.playing .icon-muted { display: none; }
.music-toggle.playing { animation: musicPulse 2.4s ease-in-out infinite; }
@keyframes musicPulse {
  0%,100% { box-shadow: 0 2px 10px rgba(200,120,150,.18); }
  50%     { box-shadow: 0 2px 18px rgba(210,110,155,.45); }
}
</style>
</head>
<body>

<audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

<button class="music-toggle" id="musicToggle" aria-label="音乐开关">
  <svg class="icon-music" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
  </svg>
  <svg class="icon-muted" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6zM3.27 2L2 3.27 20.73 22 22 20.73 3.27 2z"/>
  </svg>
</button>

<!-- ================= 封面页 ================= -->
<section class="page active" id="coverPage">
  <img id="coverImg" src="photo-1.jpg" alt="婚纱照封面" fetchpriority="high" decoding="async">
  <div class="cover-title">别来无恙啊</div>

  <div class="open-wrap" id="openWrap">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">正在加载 0%</div>
    <button class="open-btn" id="openBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
      </svg>
      开启邀请函
    </button>
  </div>
</section>

<!-- ================= 请柬页 ================= -->
<section class="page" id="invitePage">
  <canvas id="canvas"></canvas>
  <div class="invite-inner">
    <img class="invite-photo" id="invitePhoto" src="photo-1.jpg" alt="婚纱照" decoding="async">

    <div class="invite-title">盼君赴约</div>
    <div class="wedding-tag">Wedding Invitation</div>
    <div class="names">季晨阳 ♡ 许慧敏</div>
    <div class="subtitle">2026.11.14（周六）午宴</div>
    <div class="subtitle">富东大酒店（园区店）</div>

    <div class="map-links">
      <a class="map-link" href="https://surl.amap.com/88qmZiK1o5t8" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
        </svg>高德导航
      </a>
      <a class="map-link" href="https://j.map.baidu.com/a6/2cFM" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
        </svg>百度导航
      </a>
    </div>
  </div>
</section>

<script>
(function () {
  const coverImg   = document.getElementById('coverImg');
  const inviteImg  = document.getElementById('invitePhoto');
  const coverPage  = document.getElementById('coverPage');
  const invitePage = document.getElementById('invitePage');
  const openBtn    = document.getElementById('openBtn');
  const progressBar  = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const bgMusic    = document.getElementById('bgMusic');
  const musicToggle= document.getElementById('musicToggle');

  // ---------- 图片渐显 ----------
  function fadeIn(img) {
    const mark = () => img.classList.add('loaded');
    if (img.complete && img.naturalWidth > 0) mark();
    else {
      img.addEventListener('load', mark, { once: true });
      img.addEventListener('error', mark, { once: true });
    }
  }
  fadeIn(coverImg);
  fadeIn(inviteImg);

  // ---------- 加载进度 ----------
  const resources = [coverImg, inviteImg, bgMusic];
  const total = resources.length;
  let done = 0, finished = false;

  function tick() {
    if (finished) return;
    done++;
    const percent = Math.min(100, Math.round(done / total * 100));
    progressFill.style.width = percent + '%';
    progressText.textContent = '正在加载 ' + percent + '%';
    if (done >= total) {
      finished = true;
      progressBar.style.display = 'none';
      progressText.style.display = 'none';
      openBtn.classList.add('show');
    }
  }

  resources.forEach(r => {
    if (r === bgMusic) {
      if (bgMusic.readyState >= 2) tick();
      else {
        bgMusic.addEventListener('loadeddata', tick, { once: true });
        bgMusic.addEventListener('error', tick, { once: true });
        setTimeout(tick, 3000);
      }
    } else {
      if (r.complete && r.naturalWidth > 0) tick();
      else {
        r.addEventListener('load', tick, { once: true });
        r.addEventListener('error', tick, { once: true });
      }
    }
  });

  // ---------- 音乐 ----------
  let musicPlaying = false;

  function playMusic() {
    bgMusic.volume = 0.6;
    bgMusic.play().then(() => {
      musicPlaying = true;
      musicToggle.classList.add('playing');
    }).catch(() => {});
  }

  musicToggle.addEventListener('click', () => {
    if (musicPlaying) {
      bgMusic.pause();
      musicPlaying = false;
      musicToggle.classList.remove('playing');
    } else {
      playMusic();
    }
  });

  // ---------- 开启邀请函 ----------
  openBtn.addEventListener('click', () => {
    playMusic();
    coverPage.classList.remove('active');
    invitePage.classList.add('active');
    musicToggle.classList.add('show');
    setTimeout(startParticlesOnce, 300);
  });

  // ---------- 爱心粒子 ----------
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let particles = [], particleStarted = false;
  let touchX = -9999, touchY = -9999, touchActive = false;

  function resizeCanvas() {
    canvas.width  = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    initParticles();
  }

  function initParticles() {
    particles = [];
    const count = Math.floor((canvas.width * canvas.height) / 3500);
    const n = Math.max(80, Math.min(count, 400));
    for (let i = 0; i < n; i++) {
      const vx = (Math.random() - 0.5) * 0.4;
      const vy = (Math.random() - 0.5) * 0.4;
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx, vy, baseVx: vx, baseVy: vy,
        size: Math.random() * 6 + 4,
        alpha: Math.random() * 0.3 + 0.12,
        rotation: Math.random() * Math.PI * 2
      });
    }
  }

  window.addEventListener('touchmove', e => {
    if (e.touches.length > 0) {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      touchActive = true;
    }
  }, { passive: true });
  window.addEventListener('touchend', () => {
    touchActive = false; touchX = touchY = -9999;
  });

  function drawHeart(c, x, y, size, rotation, color) {
    c.save();
    c.translate(x, y);
    c.rotate(rotation);
    const s = size / 16;
    c.scale(s, s);
    c.beginPath();
    c.moveTo(0, 4);
    c.bezierCurveTo(0, 0, -8, 0, -8, 6);
    c.bezierCurveTo(-8, 11, -4, 14, 0, 18);
    c.bezierCurveTo(4, 14, 8, 11, 8, 6);
    c.bezierCurveTo(8, 0, 0, 0, 0, 4);
    c.closePath();
    c.fillStyle = color;
    c.fill();
    c.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const hasTouch = touchActive && touchX > -1000;

    particles.forEach(p => {
      if (hasTouch) {
        const dx = touchX - p.x, dy = touchY - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 180 && dist > 0) {
          const force = (1 - dist / 180) * 0.12;
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;
          p.rotation += 0.05;
        }
      }
      p.vx += (p.baseVx - p.vx) * 0.02;
      p.vy += (p.baseVy - p.vy) * 0.02;
      p.rotation += 0.005;
      p.x += p.vx; p.y += p.vy;

      if (p.x < -20) p.x = canvas.width + 20;
      if (p.x > canvas.width + 20) p.x = -20;
      if (p.y < -20) p.y = canvas.height + 20;
      if (p.y > canvas.height + 20) p.y = -20;

      let color;
      if (hasTouch) {
        const dist = Math.hypot(touchX - p.x, touchY - p.y);
        if (dist < 180) {
          const t = 1 - dist / 180;
          const r = Math.round(212 + 43 * t);
          const g = Math.round(106 + 37 * t);
          const b = Math.round(146 + 30 * t);
          color = `rgba(${r},${g},${b},${p.alpha + t * 0.35})`;
        } else {
          color = `rgba(224,130,170,${p.alpha * 0.95})`;
        }
      } else {
        color = `rgba(230,140,175,${p.alpha * 0.9})`;
      }
      drawHeart(ctx, p.x, p.y, p.size, p.rotation, color);
    });

    if (hasTouch) {
      particles.forEach(p => {
        const dist = Math.hypot(touchX - p.x, touchY - p.y);
        if (dist < 140) {
          ctx.beginPath();
          ctx.moveTo(touchX, touchY);
          ctx.lineTo(p.x, p.y);
          ctx.strokeStyle = `rgba(235,130,175,${(1 - dist / 140) * 0.28})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      });
    }
    requestAnimationFrame(animate);
  }

  function startParticlesOnce() {
    if (particleStarted) return;
    particleStarted = true;
    resizeCanvas();
    animate();
  }

  window.addEventListener('resize', () => {
    if (particleStarted) resizeCanvas();
  });
})();
</script>
</body>
</html>
